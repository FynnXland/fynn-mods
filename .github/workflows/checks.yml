name: Checks
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}
jobs:
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Claude Code version the README names as tested. Validate and test need no login.
      CLAUDE_CODE_VERSION: 2.1.325
      # Mods not yet moved to the Claude Code 2.1.323 band (one row per mod). Their checks only warn until their next
      # release; remove a mod from this list when it is released.
      PENDING_MODS: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - name: Validate and test every mod
        run: |
          status=0
          for mod in mods/*/; do
            name=$(basename "$mod")
            echo "::group::$name"
            ok=1
            claude plugin validate "$mod" --strict || ok=0
            claude plugin test "$mod" || ok=0
            echo "::endgroup::"
            if [ "$ok" = 0 ]; then
              case " $PENDING_MODS " in
                *" $name "*) echo "::warning::$name is not yet updated for Claude Code 2.1.323 (pending)";;
                *) status=1;;
              esac
            fi
          done
          exit $status
